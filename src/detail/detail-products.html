<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KKC - Detail Product</title>
    <link rel="icon" type="image/png" sizes="32x32" href="../../assets/logo-nrm.jpg" />
    <link rel="stylesheet" href="../../style/style.css" />
</head>

<body>
    <nav>
        <a href="../../index.html" class="nav-container" id="backButton">
            <img src="../../assets/logo.png" alt="logo" class="logo desktop-only" />
            <img src="../../public/arrow.svg" alt="arrow" class="back-arrow arrow-left mobile-only" />
        </a>
    </nav>

    <section>
        <div class="path-home-container desktop-only">
            <a href="../../index.html"><img src="../../public/home.svg" alt="home" /></a>
            <img src="../../public/arrow.svg" alt="arrow" class="arrow" />
            <!-- <a href="../product/filter-mobile.html" class="path-text">Detail</a> -->
            <a href="#" class="path-text">Detail</a>
        </div>
    </section>

    <main class="product-container">
        <div class="product-image">
            <img id="productImage" src="../../assets/logo.png" alt="Product" class="logo" />
        </div>
        <div class="product-info-main">
            <div class="colunm-flex">
                <h1 class="title" id="productName">กำลังโหลด...</h1>
            </div>
            <div class="product-meta">
                <span class="product-size" id="productSize">ขนาด: -</span>
                <span class="product-color" id="productColor">สี: -</span>
                <span class="product-price" id="productPrice">ราคา: -</span>
            </div>
        </div>
    </main>

    <section class="product-tab-container">
        <div class="product-tabs">
            <button class="tab-button active title" onclick="showTab('description', this)">
                Description
            </button>

            <button class="tab-button title" onclick="showTab('info', this)">
                Product Info
            </button>
        </div>

        <div id="description" class="tab-content active">
            <label class="description-sub"> - ไม่มีตำหนิ -</label>
        </div>

        <div id="info" class="tab-content">
            <table class="product-table" id="productInfoTable">
                <tr>
                    <th>รหัสสินค้า</th>
                    <td id="infoId">-</td>
                </tr>
                <tr>
                    <th>หมวดหมู่</th>
                    <td id="infoCategory">-</td>
                </tr>
                <tr>
                    <th>ชื่อสินค้า</th>
                    <td id="infoName">-</td>
                </tr>
                <tr>
                    <th>ขนาด</th>
                    <td id="infoSize">-</td>
                </tr>
                <tr>
                    <th>สี</th>
                    <td id="infoColor">-</td>
                </tr>
                <tr>
                    <th>ราคา</th>
                    <td id="infoPrice">-</td>
                </tr>
                <tr>
                    <th>สถานะ</th>
                    <td id="infoStatus">-</td>
                </tr>
            </table>
        </div>
    </section>

    <section>
        <footer>
            <div class="footer-container">
                <span class="footer-text"> © 2026 KAI KHONG CHAN </span>
            </div>
        </footer>
    </section>

    <script src="../../mockup/products.js"></script>

    <script>
        document.getElementById("backButton").addEventListener("click", function (e) {
            if (window.innerWidth <= 768) {
                e.preventDefault();
                history.back();
            }
        });
    </script>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const productId = parseInt(urlParams.get("id"));
        const product = mockProducts.find((p) => p.id === productId);

        if (product) {
            document.title = `KKC - ${product.name}`;
            document.getElementById("productImage").src = product.image.replace("./assets/", "../../assets/");
            document.getElementById("productImage").alt = product.name;
            document.getElementById("productName").textContent = product.name;
            document.getElementById("productPrice").textContent = `ราคา: ${product.price} บาท`;
            document.getElementById("productSize").textContent = `ขนาด: ${product.size}`;
            document.getElementById("productColor").textContent = `สี: ${product.color}`;
            document.getElementById("infoId").textContent = `P${String(product.id).padStart(5, "0")}`;
            document.getElementById("infoCategory").textContent =
                { shirt: "เสื้อ", pants: "กางเกง", skirt: "กระโปรง", cap: "หมวก" }[product.type] || product.type;
            document.getElementById("infoName").textContent = product.name;
            document.getElementById("infoSize").textContent = product.size;
            document.getElementById("infoColor").textContent = product.color;
            document.getElementById("infoPrice").textContent = `${product.price} บาท`;
            document.getElementById("infoStatus").setAttribute("data-status", product.status);
            document.getElementById("infoStatus").textContent = product.status;
        } else {
            document.getElementById("productName").textContent = "ไม่พบสินค้า";
            document.getElementById("productPrice").textContent = "กรุณาเลือกสินค้าใหม่";
            setTimeout(() => {
                if (confirm("ไม่พบสินค้าที่ต้องการ\nต้องการกลับไปหน้าแรกหรือไม่?")) {
                    window.location.href = "../../index.html";
                }
            }, 500);
        }

        function showTab(tabId, button) {
            document.querySelectorAll(".tab-content").forEach((content) => {
                content.classList.remove("active");
            });
            document.querySelectorAll(".tab-button").forEach((btn) => {
                btn.classList.remove("active");
            });
            document.getElementById(tabId).classList.add("active");
            button.classList.add("active");
        }
    </script>
</body>

</html>
