<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KKC - Filter</title>
    <link rel="icon" type="image/png" sizes="32x32" href="../../assets/logo-nrm.jpg" />
    <link rel="stylesheet" href="../../style/style.css" />
    <link rel="stylesheet" href="../../style/fitter.css" />
</head>

<body>
    <nav>
        <a href="../../index.html" class="nav-container">
            <img src="../../assets/logo.png" alt="logo" class="logo" />
        </a>
    </nav>

    <section>
        <div class="path-home-container">
            <a href="../../index.html"><img src="../../public/home.svg" alt="home" /></a>
            <img src="../../public/arrow.svg" alt="arrow" class="arrow" />
            <a href="filter-mobile.html" class="path-text">Filter</a>
            <img src="../../public/arrow.svg" alt="arrow" class="arrow" />
            <span class="path-text">Products</span>
        </div>
    </section>

    <section>
        <div class="fitter-row">
            <section class="fitter">
                <div class="divider-head">
                    <h1 class="title">FILTER</h1>
                </div>

                <form id="filterForm">
                    <!-- สินค้า -->
                    <div class="filter-section">
                        <h3>สินค้า</h3>
                        <div class="checkbox-form">
                            <label><input type="checkbox" name="product" value="shirt" />
                                เสื้อ</label>
                            <label><input type="checkbox" name="product" value="pants" />
                                กางเกง</label>
                            <label><input type="checkbox" name="product" value="skirt" />
                                กระโปรง</label>
                            <label><input type="checkbox" name="product" value="cap" />
                                หมวก</label>
                        </div>
                    </div>

                    <!-- ขนาดเอว -->
                    <div class="filter-section">
                        <h3>ขนาดเอว</h3>
                        <div class="checkbox-form">
                            <label><input type="checkbox" name="waist" value="S" />
                                S (20-25)</label>
                            <label><input type="checkbox" name="waist" value="M" />
                                M (25-28)</label>
                            <label><input type="checkbox" name="waist" value="L" />
                                L (30-35)</label>
                        </div>
                    </div>

                    <!-- ขนาดอก -->
                    <div class="filter-section">
                        <h3>ขนาดอก</h3>
                        <div class="checkbox-form">
                            <label><input type="checkbox" name="chest" value="S" />
                                S (40-43)</label>
                            <label><input type="checkbox" name="chest" value="M" />
                                M (44-46)</label>
                            <label><input type="checkbox" name="chest" value="L" />
                                L (46-50)</label>
                        </div>
                    </div>

                    <!-- ราคา -->
                    <div class="filter-section">
                        <h3>ราคา</h3>
                        <div class="checkbox-form">
                            <label><input type="checkbox" name="price" value="20" />
                                20 บาท</label>
                            <label><input type="checkbox" name="price" value="25" />
                                25 บาท</label>
                            <label><input type="checkbox" name="price" value="30" />
                                30 บาท</label>
                            <label><input type="checkbox" name="price" value="35" />
                                35 บาท</label>
                        </div>
                    </div>

                    <!--<button type="submit" class="filter-btn">ค้นหา</button>-->
                </form>
            </section>

            <!-- -->
            <section class="fitter-data">
                <div class="fitter-container-data-header divider-head">
                    <h1 class="title">PRODUCTS</h1>
                    <!--  -->
                    <div class="filter-mobile">
                        <a href="../product/filter-mobile.html">
                            <img src="../../public/sort.svg" alt="filter" class="filter-icon" />
                        </a>
                    </div>
                </div>

                <div class="fitter-container-data" id="productsGrid">
                    <!--  -->
                </div>

                <!--  -->
                <div class="page-number">
                    <div class="page-number-container">
                        <button class="page-number-button" id="prev" disabled>
                            <img src="../../public/arrow.svg" alt="arrow" class="arrow-left" />
                        </button>
                        <a href="#" class="page-number-button">1</a>
                        <a href="#" class="page-number-button">2</a>
                        <a href="#" class="page-number-button">3</a>
                        <a href="#" class="page-number-button">4</a>
                        <a href="#" class="page-number-button">5</a>
                        <button class="page-number-button" id="next" disabled>
                            <img src="../../public/arrow.svg" alt="arrow" class="arrow-right" />
                        </button>
                    </div>
                </div>
            </section>
        </div>
    </section>

    <section>
        <footer>
            <div class="footer-container">
                <span class="footer-text"> © 2026 KAI KHONG CHAN </span>
            </div>
        </footer>
    </section>

    <script src="../../mockup/products.js"></script>
    <script>
        // mockup
        const allProducts = mockProducts.map((product) => ({
            ...product,
            image: product.image.replace("./assets/", "../../assets/"),
        }));

        // page
        let currentPage = 1;
        const itemsPerPage = 15;
        let filteredProducts = [...allProducts];

        function renderProducts(products, page = 1) {
            const container = document.getElementById("productsGrid");
            container.innerHTML = "";

            if (products.length === 0) {
                container.innerHTML =
                    '<p class="no-results">ไม่พบสินค้าที่ตรงกับเงื่อนไข</p>';
                updatePagination(0);
                return;
            }

            const startIndex = (page - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            const paginatedProducts = products.slice(startIndex, endIndex);

            paginatedProducts.forEach((product) => {
                const card = document.createElement("div");
                card.className = "product-card";
                card.innerHTML = `
                    <div class="merch-container-card">
                        <img src="${product.image}" alt="${product.type}" class="merch-img">
                        <div class="merch-overlay-search">
                            <a href="../detail/detail-products.html?id=${product.id}" class="circle">
                                <img src="../../public/search.svg" alt="search" class="merch-img-search">
                            </a>
                        </div>
                        <div class="merch-overlay">
                            <span class="merch-overlay-title">${product.name}</span>
                            <span class="merch-overlay-sub">ขนาด: ${product.size}</span>
                            <div class="merch-overlay-sub-detail">
                                <span class="merch-overlay-sub">สี: ${product.color}</span>
                                <span class="merch-overlay-sub">${product.price} บาท</span>
                            </div>
                            <a href="../detail/detail-products.html?id=${product.id}" class="merch-overlay-sub">ดูรายละเอียด</a>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });

            updatePagination(products.length);
        }

        function updatePagination(totalItems) {
            const totalPages = Math.ceil(totalItems / itemsPerPage);
            const paginationContainer = document.querySelector(
                ".page-number-container",
            );

            paginationContainer.innerHTML = "";

            // pre
            const prevBtn = document.createElement("button");
            prevBtn.className = "page-number-button";
            prevBtn.id = "prev";
            prevBtn.disabled = currentPage === 1;
            prevBtn.innerHTML =
                '<img src="../../public/arrow.svg" alt="arrow" class="arrow-left" />';
            prevBtn.addEventListener("click", () => {
                if (currentPage > 1) {
                    currentPage--;
                    renderProducts(filteredProducts, currentPage);
                    scrollToTop();
                }
            });
            paginationContainer.appendChild(prevBtn);

            // page numbers
            const maxVisiblePages = 5;
            let startPage = Math.max(
                1,
                currentPage - Math.floor(maxVisiblePages / 2),
            );
            let endPage = Math.min(
                totalPages,
                startPage + maxVisiblePages - 1,
            );

            if (endPage - startPage < maxVisiblePages - 1) {
                startPage = Math.max(1, endPage - maxVisiblePages + 1);
            }

            for (let i = startPage; i <= endPage; i++) {
                const pageBtn = document.createElement("a");
                pageBtn.href = "#";
                pageBtn.className = "page-number-button";
                if (i === currentPage) {
                    pageBtn.classList.add("active");
                }
                pageBtn.textContent = i;
                pageBtn.addEventListener("click", (e) => {
                    e.preventDefault();
                    currentPage = i;
                    renderProducts(filteredProducts, currentPage);
                    scrollToTop();
                });
                paginationContainer.appendChild(pageBtn);
            }

            // next
            const nextBtn = document.createElement("button");
            nextBtn.className = "page-number-button";
            nextBtn.id = "next";
            nextBtn.disabled =
                currentPage === totalPages || totalPages === 0;
            nextBtn.innerHTML =
                '<img src="../../public/arrow.svg" alt="arrow" class="arrow-right" />';
            nextBtn.addEventListener("click", () => {
                if (currentPage < totalPages) {
                    currentPage++;
                    renderProducts(filteredProducts, currentPage);
                    scrollToTop();
                }
            });
            paginationContainer.appendChild(nextBtn);
        }

        function scrollToTop() {
            window.scrollTo({ top: 0, behavior: "smooth" });
        }

        // render
        filteredProducts = [...allProducts];
        renderProducts(filteredProducts, currentPage);

        // filter
        document
            .getElementById("filterForm")
            .addEventListener("submit", function (e) {
                e.preventDefault();

                const formData = new FormData(this);
                const filters = {
                    product: formData.getAll("product"),
                    waist: formData.getAll("waist"),
                    chest: formData.getAll("chest"),
                    price: formData.getAll("price"),
                };

                filteredProducts = allProducts.filter((product) => {
                    if (
                        filters.product.length &&
                        !filters.product.includes(product.type)
                    )
                        return false;
                    if (
                        filters.waist.length &&
                        !filters.waist.includes(product.waist)
                    )
                        return false;
                    if (
                        filters.chest.length &&
                        !filters.chest.includes(product.chest)
                    )
                        return false;
                    if (
                        filters.price.length &&
                        !filters.price.includes(String(product.price))
                    )
                        return false;
                    return true;
                });

                currentPage = 1;
                renderProducts(filteredProducts, currentPage);
            });

        document
            .querySelectorAll('input[type="checkbox"]')
            .forEach((checkbox) => {
                checkbox.addEventListener("change", () => {
                    document
                        .getElementById("filterForm")
                        .dispatchEvent(new Event("submit"));
                });
            });
    </script>
</body>

</html>
