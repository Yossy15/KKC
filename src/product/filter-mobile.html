<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KKC - Filter</title>
    <link rel="icon" type="image/png" sizes="32x32" href="../../assets/logo-nrm.jpg" />
    <link rel="stylesheet" href="../../style/style.css" />
</head>

<body>
    <nav>
        <a href="../../index.html" class="nav-container" id="backButton">
            <img src="../../assets/logo.png" alt="logo" class="logo desktop-only" />
            <img src="../../public/arrow.svg" alt="arrow" class="back-arrow arrow-left mobile-only" />
        </a>
    </nav>

    <section>
        <div class="path-home-container desktop-only">
            <a href="../../index.html"><img src="../../public/home.svg" alt="home" /></a>
            <img src="../../public/arrow.svg" alt="arrow" class="arrow" />
            <a href="../product/filter-mobile.html" class="path-text">Filter</a>
        </div>
    </section>

    <section class="filter-wrapper">
        <div class="filter-container">
            <div class="divider-head">
                <h1 class="title">FILTER</h1>
                <section>
                    <button class="size-chart" command="show-modal" commandfor="my-dialog">
                        ตารางไซส์
                    </button>

                    <dialog id="my-dialog">
                        <button commandfor="my-dialog" command="close">
                            <img src="../../public/close.svg" alt="close" />
                        </button>
                        <img src="../../assets/size-chart.png" alt="size-chart" class="size-chart-img" />
                    </dialog>
                </section>
            </div>

            <form id="filterForm">
                <div class="filter-section">
                    <h3>สินค้า</h3>
                    <div class="checkbox-group">
                        <label><input type="checkbox" name="product" value="shirt" /> เสื้อ</label>
                        <label><input type="checkbox" name="product" value="pants" /> กางเกง</label>
                        <label><input type="checkbox" name="product" value="skirt" /> กระโปรง</label>
                        <label><input type="checkbox" name="product" value="cap" /> หมวก</label>
                    </div>
                </div>

                <div class="filter-section">
                    <h3>สถานะ</h3>
                    <div class="checkbox-form">
                        <label><input type="checkbox" name="status" value="ขายแล้ว" /> ขายแล้ว</label>
                        <label><input type="checkbox" name="status" value="พร้อมส่ง" /> พร้อมส่ง</label>
                    </div>
                </div>

                <div class="filter-section">
                    <h3>ขนาด</h3>
                    <div class="checkbox-group">
                        <label><input type="checkbox" name="size" value="S" /> S</label>
                        <label><input type="checkbox" name="size" value="M" /> M</label>
                        <label><input type="checkbox" name="size" value="L" /> L</label>
                    </div>
                </div>

                <div class="filter-section">
                    <h3>ราคา</h3>
                    <div class="checkbox-group">
                        <label><input type="checkbox" name="price" value="20" /> 20 บาท</label>
                        <label><input type="checkbox" name="price" value="25" /> 25 บาท</label>
                        <label><input type="checkbox" name="price" value="30" /> 30 บาท</label>
                        <label><input type="checkbox" name="price" value="35" /> 35 บาท</label>
                    </div>
                </div>

                <button type="submit" class="filter-btn">ค้นหา</button>
            </form>
        </div>
    </section>

    <section>
        <footer></footer>
        <div class="footer-container">
            <span class="footer-text"> © 2026 KAI KHONG CHAN </span>
        </div>
        </footer>
    </section>

    <script>
        document.getElementById("backButton").addEventListener("click", function (e) {
            if (window.innerWidth <= 768) {
                e.preventDefault();
                history.back();
            }
        });
    </script>

    <script>
        // Load filters from localStorage or URL
        const savedFilters = localStorage.getItem('filterState');
        const urlParams = new URLSearchParams(window.location.search);

        let filters = {
            product: [],
            size: [],
            price: [],
            status: []
        };

        // Priority: localStorage > URL > default
        if (savedFilters) {
            filters = JSON.parse(savedFilters);
        } else if (urlParams.toString()) {
            filters.product = urlParams.getAll('product');
            filters.size = urlParams.getAll('size');
            filters.price = urlParams.getAll('price');
            filters.status = urlParams.getAll('status');
        }

        // Default: พร้อมส่ง if no status selected
        if (filters.status.length === 0) {
            filters.status = ['พร้อมส่ง'];
        }

        // Check checkboxes based on filters
        Object.keys(filters).forEach(key => {
            filters[key].forEach(value => {
                document.querySelectorAll(`input[name="${key}"][value="${value}"]`)
                    .forEach(cb => cb.checked = true);
            });
        });

        document.getElementById("filterForm").addEventListener("submit", function (e) {
            e.preventDefault();
            const formData = new FormData(this);
            const newFilters = {
                product: formData.getAll('product'),
                size: formData.getAll('size'),
                price: formData.getAll('price'),
                status: formData.getAll('status')
            };

            // Save to localStorage
            localStorage.setItem('filterState', JSON.stringify(newFilters));

            const params = new URLSearchParams(formData);
            window.location.href = "./filter-products.html?" + params.toString();
        });
    </script>
</body>

</html>
