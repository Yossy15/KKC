<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KKC - ข้อมูลโปรไฟล์</title>
    <link rel="icon" type="image/png" sizes="32x32" href="../../assets/logo-nrm.jpg" />
    <link rel="stylesheet" href="../../style/style.css" />
</head>

<body>
    <nav>
        <a href="../../index.html" class="nav-container">
            <img src="../../public/arrow.svg" alt="arrow" class="back-arrow arrow-left mobile-only" />
            <img src="../../assets/logo.png" alt="logo" class="logo desktop-only" />
        </a>
        <div class="nav-icon-group">
            <a href="#" class="nav-cart">
                <img src="../../public/cart.svg" alt="cart">
            </a>
            <div id="profile-container">
                <img src="../../assets/profile-mock.png" alt="profile" class="nav-profile" id="navProfileImg" />
            </div>
        </div>
    </nav>

    <section>
        <div class="path-home-container desktop-only">
            <a href="../../index.html"><img src="../../public/home.svg" alt="home" /></a>
            <img src="../../public/arrow.svg" alt="arrow" class="arrow" />
            <span class="path-text">Profile</span>
        </div>
    </section>

    <main class="profile-wrapper">
        <div class="profile-layout">
            <!-- Sidebar Navigation -->
            <aside class="profile-sidebar">
                <div class="profile-user-card">
                    <img src="../../assets/profile-mock.png" alt="avatar" class="profile-avatar-lg"
                        id="profileAvatar" />
                    <div class="profile-user-name" id="sidebarUserName">กำลังโหลด...</div>
                    <div class="profile-user-role" id="sidebarUserRole">USER</div>
                </div>

                <button type="button" class="profile-nav-btn" onclick="handleMenuClick('info', this)">
                    <span>ข้อมูลส่วนตัว</span>
                    <span class="profile-nav-arrow mobile-only">›</span>
                </button>
                <button type="button" class="profile-nav-btn" onclick="handleMenuClick('orders', this)">
                    <span>ออร์เดอร์ของฉัน</span>
                    <span class="profile-nav-arrow mobile-only">›</span>
                </button>
                <button type="button" class="profile-nav-btn" onclick="handleMenuClick('support', this)">
                    <span>แจ้งปัญหา</span>
                    <span class="profile-nav-arrow mobile-only">›</span>
                </button>
                <button type="button" class="profile-nav-btn logout" onclick="handleLogout()">
                    <span>ออกจากระบบ</span>
                </button>
            </aside>

            <!-- Main Content Area -->
            <section class="profile-content">
                <!-- Panel 1: Personal Info -->
                <div class="profile-panel active" id="panel-info">
                    <h2 class="title profile-panel-title">ข้อมูลส่วนตัว</h2>
                    <div class="info-grid">
                        <div class="info-item">
                            <span class="info-label">ชื่อ - นามสกุล</span>
                            <span class="info-value" id="infoName">-</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">ชื่อผู้ใช้ (Username)</span>
                            <span class="info-value" id="infoUsername">-</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">อีเมล</span>
                            <span class="info-value" id="infoEmail">-</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">เบอร์โทรศัพท์</span>
                            <span class="info-value" id="infoPhone">-</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">สถานะบัญชี</span>
                            <span class="info-value" id="infoStatus">Active</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">ระดับผู้ใช้</span>
                            <span class="info-value" id="infoRole">User</span>
                        </div>
                    </div>
                </div>

                <!-- Panel 2: Orders -->
                <div class="profile-panel" id="panel-orders">
                    <h2 class="title profile-panel-title">รายการคำสั่งซื้อและสถานะจัดส่ง</h2>
                    <div class="order-list" id="orderListContainer">
                        <div style="text-align: center; color: #888; padding: 40px 0;">กำลังโหลดรายการ...</div>
                    </div>
                </div>

                <!-- Panel 3: Support / Issue Report -->
                <div class="profile-panel" id="panel-support">
                    <h2 class="title profile-panel-title">แจ้งปัญหาการใช้งาน</h2>
                    <form id="supportForm" class="auth-form" onsubmit="handleSupportSubmit(event)">
                        <div class="auth-field">
                            <label for="issueTopic">หัวข้อปัญหา</label>
                            <select id="issueTopic" class="auth-input" required>
                                <option value="">-- เลือกหัวข้อปัญหา --</option>
                                <option value="product">สินค้าชำรุด / ไม่ตรงตามคำสั่งซื้อ</option>
                                <option value="delivery">การจัดส่งล่าช้า / ไม่ได้รับสินค้า</option>
                                <option value="payment">ปัญหาการชำระเงิน</option>
                                <option value="account">ปัญหาเกี่ยวกับบัญชีผู้ใช้</option>
                                <option value="other">เรื่องอื่นๆ</option>
                            </select>
                        </div>
                        <div class="auth-field">
                            <label for="orderRef">เลขออร์เดอร์ที่เกี่ยวข้อง (ถ้ามี)</label>
                            <input type="text" id="orderRef" class="auth-input" placeholder="เช่น #ORD-00123" />
                        </div>
                        <div class="auth-field">
                            <label for="issueDetail">รายละเอียดปัญหา</label>
                            <textarea id="issueDetail" class="auth-input" rows="5"
                                placeholder="กรุณาระบุรายละเอียดปัญหาที่ท่านพบให้ชัดเจน..." style="resize: vertical;"
                                required></textarea>
                        </div>
                        <button type="submit" class="auth-btn">ส่งเรื่องแจ้งปัญหา</button>
                    </form>
                    <div id="supportSuccess"
                        style="display: none; margin-top: 16px; padding: 16px; background-color: #d4edda; color: #155724; border-radius: 6px; font-family: var(--font-krub);">
                        ✓ ส่งเรื่องแจ้งปัญหาเรียบร้อยแล้ว ทีมงานจะตรวจสอบและติดต่อกลับโดยเร็วที่สุด
                    </div>
                </div>
            </section>
        </div>
    </main>

    <script src="../../mockup/products.js"></script>
    <script src="../../mockup/user.js"></script>
    <script src="../../mockup/order.js"></script>
    <script>
        // Check Authentication
        const authData = localStorage.getItem("auth");
        if (!authData) {
            window.location.href = "../login/login.html";
        }

        let currentUser = {};
        try {
            currentUser = JSON.parse(authData);
        } catch (e) {
            window.location.href = "../login/login.html";
        }

        // Render Personal Info
        document.getElementById("sidebarUserName").textContent = currentUser.name || currentUser.username || "ผู้ใช้";
        document.getElementById("sidebarUserRole").textContent = currentUser.role || "USER";
        if (currentUser.img) {
            document.getElementById("profileAvatar").src = currentUser.img.replace("./assets/", "../../assets/");
            document.getElementById("navProfileImg").src = currentUser.img.replace("./assets/", "../../assets/");
        }

        document.getElementById("infoName").textContent = currentUser.name || "-";
        document.getElementById("infoUsername").textContent = currentUser.username || "-";
        document.getElementById("infoEmail").textContent = currentUser.email || "-";
        document.getElementById("infoPhone").textContent = currentUser.phone || "-";
        document.getElementById("infoRole").textContent = currentUser.role || "User";

        // Activate first button only on desktop
        if (window.innerWidth > 768) {
            const firstBtn = document.querySelector(".profile-nav-btn");
            if (firstBtn) firstBtn.classList.add("active");
        }

        // Navigation handling (separate pages on mobile, tabs on desktop)
        function handleMenuClick(tabId, btn) {
            if (window.innerWidth <= 768) {
                if (tabId === "info") window.location.href = "personal.html";
                else if (tabId === "orders") window.location.href = "orders.html";
                else if (tabId === "support") window.location.href = "support.html";
            } else {
                switchProfileTab(tabId, btn);
            }
        }

        // Tab Switching on desktop
        function switchProfileTab(tabId, btn) {
            document.querySelectorAll(".profile-panel").forEach((p) => p.classList.remove("active"));
            document.querySelectorAll(".profile-nav-btn").forEach((b) => b.classList.remove("active"));

            const targetPanel = document.getElementById("panel-" + tabId);
            if (targetPanel) targetPanel.classList.add("active");
            if (btn) btn.classList.add("active");

            if (tabId === "orders") {
                renderOrders();
            }
        }

        // Render Orders
        function renderOrders() {
            const container = document.getElementById("orderListContainer");
            if (!container) return;

            let userOrders = [];
            if (typeof mockOrders !== "undefined") {
                userOrders = mockOrders.filter((o) => o.userId === currentUser.id);
                // If user has no orders (e.g. newly created account), pick first 3 mock orders as sample
                if (userOrders.length === 0) {
                    userOrders = mockOrders.slice(0, 4);
                }
            }

            if (userOrders.length === 0) {
                container.innerHTML = `<div style="text-align: center; color: #888; padding: 40px 0; font-family: var(--font-krub);">ยังไม่มีรายการคำสั่งซื้อ</div>`;
                return;
            }

            const badgeClassMap = {
                "รอดำเนินการ": "badge-pending",
                "กำลังจัดส่ง": "badge-shipping",
                "จัดส่งแล้ว": "badge-delivered",
                "ยกเลิก": "badge-cancelled"
            };

            container.innerHTML = userOrders.map((order) => {
                const product = typeof mockProducts !== "undefined"
                    ? mockProducts.find((p) => p.id === order.productId) || { name: `สินค้า #${order.productId}`, image: "../../assets/logo.png" }
                    : { name: `สินค้า #${order.productId}`, image: "../../assets/logo.png" };

                const imgPath = product.image ? product.image.replace("./assets/", "../../assets/") : "../../assets/logo.png";
                const badgeClass = badgeClassMap[order.status] || "badge-pending";
                const dateStr = new Date(order.createdAt).toLocaleDateString("th-TH", {
                    year: "numeric",
                    month: "short",
                    day: "numeric",
                    hour: "2-digit",
                    minute: "2-digit"
                });

                return `
                    <div class="order-card">
                        <div class="order-header">
                            <div>
                                <span class="order-id">คำสั่งซื้อ #ORD-${String(order.id).padStart(5, "0")}</span>
                                <span style="color: #888; margin-left: 10px;">${dateStr}</span>
                            </div>
                            <span class="order-badge ${badgeClass}">${order.status}</span>
                        </div>
                        <div class="order-body">
                            <img src="${imgPath}" alt="${product.name}" class="order-img" />
                            <div class="order-details">
                                <span class="order-product-name">${product.name}</span>
                                <span class="order-qty-price">จำนวน: ${order.quantity} ชิ้น | ราคาชิ้นละ ${order.price} บาท</span>
                            </div>
                            <div class="order-total">
                                ยอดรวม: ${order.total} บาท
                            </div>
                        </div>
                    </div>
                `;
            }).join("");
        }

        // Handle Support Form
        function handleSupportSubmit(e) {
            e.preventDefault();
            const topic = document.getElementById("issueTopic").value;
            const orderRef = document.getElementById("orderRef").value;
            const detail = document.getElementById("issueDetail").value;

            document.getElementById("supportForm").reset();
            document.getElementById("supportSuccess").style.display = "block";
            setTimeout(() => {
                const el = document.getElementById("supportSuccess");
                if (el) el.style.display = "none";
            }, 6000);
        }

        // Handle Logout
        function handleLogout() {
            if (confirm("คุณต้องการออกจากระบบหรือไม่?")) {
                localStorage.removeItem("auth");
                window.location.href = "../../index.html";
            }
        }
    </script>
</body>

</html>
