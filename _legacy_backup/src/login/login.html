<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KKC - เข้าสู่ระบบ / สมัครสมาชิก</title>
    <link rel="icon" type="image/png" sizes="32x32" href="../../assets/logo-nrm.jpg" />
    <link rel="stylesheet" href="../../style/style.css" />
</head>

<body>
    <nav>
        <a href="../../index.html" class="nav-container">
            <img src="../../assets/logo.png" alt="logo" class="logo" />
        </a>
    </nav>

    <section>
        <div class="path-home-container desktop-only">
            <a href="../../index.html"><img src="../../public/home.svg" alt="home" /></a>
            <img src="../../public/arrow.svg" alt="arrow" class="arrow" />
            <span class="path-text" id="breadcrumbText">Login</span>
        </div>
    </section>

    <main class="auth-wrapper">
        <div class="auth-container">
            <div class="auth-tabs">
                <button type="button" class="auth-tab active" id="tabLoginBtn" onclick="switchAuthTab('login')">
                    เข้าสู่ระบบ
                </button>
                <button type="button" class="auth-tab" id="tabRegisterBtn" onclick="switchAuthTab('register')">
                    สมัครสมาชิก
                </button>
            </div>

            <!-- Login Form -->
            <form id="loginForm" class="auth-form" onsubmit="handleLogin(event)">
                <div class="auth-field">
                    <label for="loginUser">ชื่อผู้ใช้ หรือ อีเมล</label>
                    <input type="text" id="loginUser" class="auth-input" placeholder="เช่น kkc1 หรือ kkc1@g.co" required />
                </div>
                <div class="auth-field">
                    <label for="loginPass">รหัสผ่าน</label>
                    <input type="password" id="loginPass" class="auth-input" placeholder="รหัสผ่าน" required />
                </div>
                <div id="loginError" class="auth-error"></div>
                <button type="submit" class="auth-btn">เข้าสู่ระบบ</button>
                <div class="auth-switch-text">
                    ยังไม่มีบัญชี? <a onclick="switchAuthTab('register')">สมัครสมาชิก</a>
                </div>
            </form>

            <!-- Register Form -->
            <form id="registerForm" class="auth-form" style="display: none;" onsubmit="handleRegister(event)">
                <div class="auth-field">
                    <label for="regName">ชื่อ - นามสกุล</label>
                    <input type="text" id="regName" class="auth-input" placeholder="เช่น สมชาย ใจดี" required />
                </div>
                <div class="auth-field">
                    <label for="regUsername">ชื่อผู้ใช้</label>
                    <input type="text" id="regUsername" class="auth-input" placeholder="เช่น somchai99" required />
                </div>
                <div class="auth-field">
                    <label for="regEmail">อีเมล</label>
                    <input type="email" id="regEmail" class="auth-input" placeholder="เช่น somchai@example.com" required />
                </div>
                <div class="auth-field">
                    <label for="regPhone">เบอร์โทรศัพท์</label>
                    <input type="tel" id="regPhone" class="auth-input" placeholder="เช่น 0812345678" required />
                </div>
                <div class="auth-field">
                    <label for="regPass">รหัสผ่าน</label>
                    <input type="password" id="regPass" class="auth-input" placeholder="อย่างน้อย 4 ตัวอักษร" minlength="4" required />
                </div>
                <div class="auth-field">
                    <label for="regConfirmPass">ยืนยันรหัสผ่าน</label>
                    <input type="password" id="regConfirmPass" class="auth-input" placeholder="กรอกรหัสผ่านอีกครั้ง" required />
                </div>
                <div id="registerError" class="auth-error"></div>
                <button type="submit" class="auth-btn">สมัครสมาชิก</button>
                <div class="auth-switch-text">
                    มีบัญชีอยู่แล้ว? <a onclick="switchAuthTab('login')">เข้าสู่ระบบ</a>
                </div>
            </form>
        </div>
    </main>

    <script src="../../mockup/user.js"></script>
    <script>
        // Check if already logged in
        if (localStorage.getItem("auth")) {
            window.location.href = "../../index.html";
        }

        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get("tab") === "register") {
            switchAuthTab("register");
        }

        function switchAuthTab(tab) {
            const loginForm = document.getElementById("loginForm");
            const registerForm = document.getElementById("registerForm");
            const tabLoginBtn = document.getElementById("tabLoginBtn");
            const tabRegisterBtn = document.getElementById("tabRegisterBtn");
            const breadcrumb = document.getElementById("breadcrumbText");

            document.getElementById("loginError").style.display = "none";
            document.getElementById("registerError").style.display = "none";

            if (tab === "register") {
                loginForm.style.display = "none";
                registerForm.style.display = "flex";
                tabLoginBtn.classList.remove("active");
                tabRegisterBtn.classList.add("active");
                breadcrumb.textContent = "Register";
            } else {
                loginForm.style.display = "flex";
                registerForm.style.display = "none";
                tabLoginBtn.classList.add("active");
                tabRegisterBtn.classList.remove("active");
                breadcrumb.textContent = "Login";
            }
        }

        function getStoredUsers() {
            try {
                return JSON.parse(localStorage.getItem("users")) || [];
            } catch (e) {
                return [];
            }
        }

        function handleLogin(e) {
            e.preventDefault();
            const inputUser = document.getElementById("loginUser").value.trim().toLowerCase();
            const inputPass = document.getElementById("loginPass").value;
            const errEl = document.getElementById("loginError");

            errEl.style.display = "none";

            const localUsers = getStoredUsers();
            let found = localUsers.find(
                (u) => (u.username.toLowerCase() === inputUser || u.email.toLowerCase() === inputUser) && u.password === inputPass
            );

            // Also check mockUsers
            if (!found && typeof mockUsers !== "undefined") {
                found = mockUsers.find(
                    (u) => u.username.toLowerCase() === inputUser || u.email.toLowerCase() === inputUser
                );
            }

            if (found) {
                const sessionUser = {
                    id: found.id,
                    username: found.username,
                    name: found.name,
                    email: found.email,
                    phone: found.phone || "",
                    role: found.role || "user",
                    img: found.img || "./assets/profile-mock.png"
                };
                localStorage.setItem("auth", JSON.stringify(sessionUser));
                window.location.href = "../../index.html";
            } else {
                errEl.textContent = "ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง";
                errEl.style.display = "block";
            }
        }

        function handleRegister(e) {
            e.preventDefault();
            const name = document.getElementById("regName").value.trim();
            const username = document.getElementById("regUsername").value.trim();
            const email = document.getElementById("regEmail").value.trim();
            const phone = document.getElementById("regPhone").value.trim();
            const pass = document.getElementById("regPass").value;
            const confirmPass = document.getElementById("regConfirmPass").value;
            const errEl = document.getElementById("registerError");

            errEl.style.display = "none";

            if (pass !== confirmPass) {
                errEl.textContent = "รหัสผ่านและยืนยันรหัสผ่านไม่ตรงกัน";
                errEl.style.display = "block";
                return;
            }

            const localUsers = getStoredUsers();
            const usernameExists = localUsers.some((u) => u.username.toLowerCase() === username.toLowerCase()) ||
                (typeof mockUsers !== "undefined" && mockUsers.some((u) => u.username.toLowerCase() === username.toLowerCase()));

            if (usernameExists) {
                errEl.textContent = "ชื่อผู้ใช้นี้มีอยู่ในระบบแล้ว";
                errEl.style.display = "block";
                return;
            }

            const emailExists = localUsers.some((u) => u.email.toLowerCase() === email.toLowerCase()) ||
                (typeof mockUsers !== "undefined" && mockUsers.some((u) => u.email.toLowerCase() === email.toLowerCase()));

            if (emailExists) {
                errEl.textContent = "อีเมลนี้มีอยู่ในระบบแล้ว";
                errEl.style.display = "block";
                return;
            }

            const newUser = {
                id: Date.now(),
                img: "./assets/profile-mock.png",
                username: username,
                name: name,
                email: email,
                phone: phone,
                password: pass,
                role: "user",
                status: "active"
            };

            localUsers.push(newUser);
            localStorage.setItem("users", JSON.stringify(localUsers));

            const sessionUser = {
                id: newUser.id,
                username: newUser.username,
                name: newUser.name,
                email: newUser.email,
                phone: newUser.phone,
                role: newUser.role,
                img: newUser.img
            };
            localStorage.setItem("auth", JSON.stringify(sessionUser));
            window.location.href = "../../index.html";
        }
    </script>
</body>

</html>
