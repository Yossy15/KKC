    <dialog id="loginDialog">

            <!-- Login Form -->

                    <input type="text" id="modalLoginUser" class="auth-input" placeholder="เช่น kkc1 หรือ kkc1@g.co" required />
                </div>
                <div class="auth-field">
                    <label for="modalLoginPass">รหัสผ่าน</label>
                    <input type="password" id="modalLoginPass" class="auth-input" placeholder="รหัสผ่าน" required />
                </div>
                <div id="modalLoginError" class="auth-error"></div>
                <button type="submit" class="auth-btn">เข้าสู่ระบบ</button>
                <div class="auth-switch-text">
                    ยังไม่มีบัญชี? <a onclick="switchModalAuthTab('register')">สมัครสมาชิก</a>
                </div>
            </form>

    <script>
        const profileContainer = document.getElementById("profile-container");
        const profileImg = document.createElement("img");
        const buttonLogin = document.createElement("button");
        const loginDialog = document.getElementById("loginDialog");

        if (loginDialog) {
            loginDialog.addEventListener("click", (e) => {
                if (e.target === loginDialog) loginDialog.close();
            });
        }

        function switchModalAuthTab(tab) {
            const loginForm = document.getElementById("modalLoginForm");
            const regForm = document.getElementById("modalRegisterForm");
            const tabLogin = document.getElementById("modalTabLoginBtn");
            const tabReg = document.getElementById("modalTabRegisterBtn");
            document.getElementById("modalLoginError").style.display = "none";
            document.getElementById("modalRegisterError").style.display = "none";

            if (tab === "register") {
                loginForm.style.display = "none";
                regForm.style.display = "flex";
                tabLogin.classList.remove("active");
                tabReg.classList.add("active");
            } else {
                loginForm.style.display = "flex";
                regForm.style.display = "none";
                tabLogin.classList.add("active");
                tabReg.classList.remove("active");
            }
        }

        function handleModalLogin(e) {
            e.preventDefault();
            const u = document.getElementById("modalLoginUser").value.trim().toLowerCase();
            const p = document.getElementById("modalLoginPass").value;
            const err = document.getElementById("modalLoginError");
            err.style.display = "none";

            const localUsers = JSON.parse(localStorage.getItem("users") || "[]");
            let found = localUsers.find(
                (x) => (x.username.toLowerCase() === u || x.email.toLowerCase() === u) && x.password === p
            );
            if (!found && typeof mockUsers !== "undefined") {
                found = mockUsers.find(
                    (x) => x.username.toLowerCase() === u || x.email.toLowerCase() === u
                );
            }

            if (found) {
                localStorage.setItem("auth", JSON.stringify({
                    id: found.id,
                    username: found.username,
                    name: found.name,
                    email: found.email,
                    phone: found.phone || "",
                    role: found.role || "user",
                    img: found.img || "./assets/profile-mock.png"
                }));
                location.reload();
            } else {
                err.textContent = "ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง";
                err.style.display = "block";
            }
        }

        function handleModalRegister(e) {
            e.preventDefault();
            const name = document.getElementById("modalRegName").value.trim();
            const username = document.getElementById("modalRegUsername").value.trim();
            const email = document.getElementById("modalRegEmail").value.trim();
            const phone = document.getElementById("modalRegPhone").value.trim();
            const pass = document.getElementById("modalRegPass").value;
            const confirmPass = document.getElementById("modalRegConfirmPass").value;
            const err = document.getElementById("modalRegisterError");
            err.style.display = "none";

            if (pass !== confirmPass) {
                err.textContent = "รหัสผ่านและยืนยันรหัสผ่านไม่ตรงกัน";
                err.style.display = "block";
                return;
            }

            const localUsers = JSON.parse(localStorage.getItem("users") || "[]");
            const exists = localUsers.some(x => x.username.toLowerCase() === username.toLowerCase() || x.email.toLowerCase() === email.toLowerCase()) ||
                (typeof mockUsers !== "undefined" && mockUsers.some(x => x.username.toLowerCase() === username.toLowerCase() || x.email.toLowerCase() === email.toLowerCase()));

            if (exists) {
                err.textContent = "ชื่อผู้ใช้หรืออีเมลนี้มีอยู่ในระบบแล้ว";
                err.style.display = "block";
                return;
            }

            const newUser = { id: Date.now(), img: "./assets/profile-mock.png", username, name, email, phone, password: pass, role: "user", status: "active" };
            localUsers.push(newUser);
            localStorage.setItem("users", JSON.stringify(localUsers));
            localStorage.setItem("auth", JSON.stringify({ id: newUser.id, username, name, email, phone, role: "user", img: newUser.img }));
            location.reload();
        }

        const authData = localStorage.getItem("auth");
        if (authData) {
            let auth = {};
            try { auth = JSON.parse(authData); } catch (e) { }
            profileImg.src = auth.img || "./assets/profile-mock.png";
            profileImg.alt = "profile";
            profileImg.classList.add("nav-profile");
            profileImg.title = `${auth.name || auth.username || "ผู้ใช้"}`;
            profileImg.onclick = function () {
                window.location.href = "./src/profile/profile.html";
            };
            profileContainer.appendChild(profileImg);
        } else {
            buttonLogin.textContent = "Login";
            buttonLogin.classList.add("login-btn");
            buttonLogin.onclick = function () {
                if (window.innerWidth > 768) {
                    loginDialog.showModal();
                } else {
                    window.location.href = "./src/login/login.html";
                }
            };
            profileContainer.appendChild(buttonLogin);
        }
    </script>
    <script>

    <script>
        const containers = [
            { id: "merch-container-shirt", type: "shirt" },
            { id: "merch-container-pants", type: "pants" },
            { id: "merch-container-skirts", type: "skirt" },
            { id: "merch-container-cap", type: "cap" },
            { id: "merch-container-all", type: ["shirt", "pants", "skirt", "cap"] }
        ];

        containers.forEach((c) => {
            const el = document.getElementById(c.id);
            // const products = mockProducts
            //     .filter((p) =>
            //         Array.isArray(c.type)
            //             ? c.type.includes(p.type)
            //             : p.type === c.type
            //     )
            //     .slice(0, 10);
            const products = mockProducts
                .filter((p) =>
                    Array.isArray(c.type)
                        ? c.type.includes(p.type)
                        : p.type === c.type
                )
                .filter((p) => p.status !== "ขายแล้ว")
                .slice(0, 10);
            el.innerHTML = products
                .map(
                    (p) => `
                    <div class="merch-container-card">
                        <img src="${p.image}" alt="${p.type}" class="merch-img">
                        ${p.status === "ขายแล้ว" ? '<img src="./assets/sell.png" alt="sold" class="sold-overlay">' : ""}
                        <div class="merch-overlay-search">
                            <a href="./src/detail/detail-products.html?id=${p.id}" class="circle">
                                <img src="./public/search.svg" alt="search" class="merch-img-search">
                            </a>
                        </div>
                        <div class="merch-overlay">
                            <span class="merch-overlay-title">${p.name}</span>
                            <span class="merch-overlay-sub">ขนาด: ${p.size}</span>
                            <div class="merch-overlay-sub-detail">
                                <span class="merch-overlay-sub">สี: ${p.color}</span>
                                <span class="merch-overlay-sub">${p.price} บาท</span>
                            </div>
                            <a href="./src/detail/detail-products.html?id=${p.id}" class="merch-overlay-sub">ดูรายละเอียด</a>
                        </div>
                    </div>
                `,
                )
                .join("");
        });

        document.querySelectorAll(".merch-scroll-wrapper").forEach((w) => {
            const track = w.querySelector(".merch-container-body");
            const btnL = w.querySelector(".merch-scroll-btn--left");
            const btnR = w.querySelector(".merch-scroll-btn--right");

            const update = () => {
                const max = track.scrollWidth - track.clientWidth;
                btnL.style.display =
                    track.scrollLeft <= 1 ? "none" : "flex";
                btnR.style.display =
                    track.scrollLeft >= max - 1 ? "none" : "flex";
            };

            btnL.onclick = () => {
                const card = track.querySelector(".merch-container-card");
                const gap = parseFloat(getComputedStyle(track).gap) || 0;
                track.scrollBy({
                    left: -(card.offsetWidth + gap),
                    behavior: "smooth",
                });
            };

            btnR.onclick = () => {
                const card = track.querySelector(".merch-container-card");
                const gap = parseFloat(getComputedStyle(track).gap) || 0;
                track.scrollBy({
                    left: card.offsetWidth + gap,
                    behavior: "smooth",
                });
            };

            track.onscroll = update;
            window.onresize = update;
            update();
        });
    </script>
