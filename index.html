<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KKC - Home</title>
    <link rel="stylesheet" href="style/style.css">
    <!-- Favicon (web icon) -->
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/logo-nrm.jpg">
    <!-- Alternative formats -->
    <link rel="icon" type="image/x-icon" href="./assets/logo-nrm.jpg">
    <link rel="apple-touch-icon" sizes="180x180" href="./assets/logo-nrm.jpg">
</head>

<body>
    <nav>
        <a href="index.html" class="nav-container">
            <img src="./assets/logo.png" alt="logo" class="logo">
            <!-- <h1 class="title"> KAI KHONG CHAN </h1> -->
        </a>
    </nav>

    <section>
        <main>
            <!-- เสื้อ -->
            <section>
                <!-- hede -->
                <section>
                    <div class="merch-container">
                        <h1 class="title">T-SHIRT</h1>
                        <a class="arrow-btn" href="./fitter.html" aria-label="เพิ่มเติม">
                            <span class="arrow-btn-text">เพิ่มเติม</span>
                            <span class="arrow-btn-icon">&#8250;</span>
                        </a>
                    </div>
                </section>
                    
                <!-- รายการเสื้อ -->
                <section>
                    <div class="merch-scroll-wrapper">
                        <button class="merch-scroll-btn merch-scroll-btn--left" aria-label="เลื่อนซ้าย">&#8249;</button>
                        <div class="merch-container-body" id="merch-container-shirt"></div>
                        <button class="merch-scroll-btn merch-scroll-btn--right" aria-label="เลื่อนขวา">&#8250;</button>
                    </div>
                </section>
            </section>
            

            <!-- กางเกง -->
            <section>
                <!--  -->
                <section>
                    <div class="merch-container">
                        <h1 class="title">PANTS</h1>
                        <a class="arrow-btn" href="./fitter.html" aria-label="เพิ่มเติม">
                            <span class="arrow-btn-text">เพิ่มเติม</span>
                            <span class="arrow-btn-icon">&#8250;</span>
                        </a>
                    </div>
                </section>
                
                <!--  -->
                <section>
                    <div class="merch-scroll-wrapper">
                        <button class="merch-scroll-btn merch-scroll-btn--left" aria-label="เลื่อนซ้าย">&#8249;</button>
                        <div class="merch-container-body" id="merch-container-pants"></div>
                        <button class="merch-scroll-btn merch-scroll-btn--right" aria-label="เลื่อนขวา">&#8250;</button>
                    </div>
                </section>
                
            </section>


            <!-- กระโปรง -->
            <section>
                <!--  -->
                <section>
                    <div class="merch-container">
                        <h1 class="title">SKIRTS</h1>
                        <a class="arrow-btn" href="./fitter.html" aria-label="เพิ่มเติม">
                            <span class="arrow-btn-text">เพิ่มเติม</span>
                            <span class="arrow-btn-icon">&#8250;</span>
                        </a>
                    </div>
                </section>
                
                <!--  -->
                <section>
                    <div class="merch-scroll-wrapper">
                        <button class="merch-scroll-btn merch-scroll-btn--left" aria-label="เลื่อนซ้าย">&#8249;</button>
                        <div class="merch-container-body" id="merch-container-skirts"></div>
                        <button class="merch-scroll-btn merch-scroll-btn--right" aria-label="เลื่อนขวา">&#8250;</button>
                    </div>
                </section>
            </section>

            <!-- หมวก -->
            <section>
                <!--  -->
                <section>
                    <div class="merch-container">
                        <h1 class="title">CAPS</h1>
                        <a class="arrow-btn" href="./fitter.html" aria-label="เพิ่มเติม">
                            <span class="arrow-btn-text">เพิ่มเติม</span>
                            <span class="arrow-btn-icon">&#8250;</span>
                        </a>
                    </div>
                </section>
                
                <!--  -->
                <section>
                    <div class="merch-scroll-wrapper">
                        <button class="merch-scroll-btn merch-scroll-btn--left" aria-label="เลื่อนซ้าย">&#8249;</button>
                        <div class="merch-container-body" id="merch-container-cap"></div>
                        <button class="merch-scroll-btn merch-scroll-btn--right" aria-label="เลื่อนขวา">&#8250;</button>
                    </div>
                </section>
            </section>
        </main>
    </section>
    

    <section>
        <footer>
            <div class="footer-container">
                <span class="footer-text"> © 2026 KAI KHONG CHAN </span>
            </div>
        </footer>
    </section>
    

    <script src="./js/scroll.js"></script>

    <script>
        const products = [
            { container: "merch-container-shirt", image: "./assets/shirt.png", alt: "shirt", name: "Classic Tee" },
            { container: "merch-container-pants", image: "./assets/pants.png", alt: "pants", name: "Classic Pants" },
            { container: "merch-container-skirts", image: "./assets/skirt.png", alt: "skirts", name: "Classic Skirts" },
            { container: "merch-container-cap", image: "./assets/cap.png", alt: "cap", name: "Classic Cap" }
        ];

        products.forEach(product => {
            const container = document.getElementById(product.container);
            for (let i = 0; i < 10; i++) {
                container.innerHTML += `
            <div class="merch-container-card">
                <img src="${product.image}" alt="${product.alt}" class="merch-img" >
                <div class="merch-overlay-search">
                    <a href="#" class="circle">
                        <img src="./public/search.svg" alt="other" class="merch-img-search">
                    </a>
                </div>

                <div class="merch-overlay">
                    <span class="merch-overlay-title"> ${product.name} ${i + 1}</span>
                    <span class="merch-overlay-sub"> ขนาด: S-XL </span>
                    <div class="merch-overlay-sub-detail">
                        <span class="merch-overlay-sub"> สี: ดำ </span>
                        <span class="merch-overlay-sub"> ${i + 20} บาท </span>
                    </div>
                    <span class="merch-overlay-sub"> ดูรายละเอียด </span>
                </div>
            </div>
            `;
            }
        });
    </script>
</body>

</html>
