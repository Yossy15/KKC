<body>

    <section>

                </section>

                <section>

                        <button class="merch-scroll-btn merch-scroll-btn--left" aria-label="เลื่อนซ้าย">
                            &#8249;
                        </button>
                        <div class="merch-container-body" id="merch-container-shirt"></div>

                        </button>
                    </div>
                </section>
            </section>

            <section>
                <section>
                    <div class="merch-container">
                        <h1 class="title">PANTS</h1>
                        <a class="arrow-btn" href="./src/product/filter-products.html" aria-label="เพิ่มเติม">
                            <span class="arrow-btn-text">เพิ่มเติม</span>
                            <span class="arrow-btn-icon">&#8250;</span>
                        </a>
                    </div>
                </section>

                <section>
                    <div class="merch-scroll-wrapper">
                        <button class="merch-scroll-btn merch-scroll-btn--left" aria-label="เลื่อนซ้าย">
                            &#8249;
                        </button>
                        <div class="merch-container-body" id="merch-container-pants"></div>

                            &#8250;
                        </button>
                    </div>
                </section>
            </section>

            <section>
                <section>
                    <div class="merch-container">
                        <h1 class="title">SKIRTS</h1>
                        <a class="arrow-btn" href="./src/product/filter-products.html" aria-label="เพิ่มเติม">
                            <span class="arrow-btn-text">เพิ่มเติม</span>
                            <span class="arrow-btn-icon">&#8250;</span>
                        </a>
                    </div>
                </section>

                <section>
                    <div class="merch-scroll-wrapper">
                        <button class="merch-scroll-btn merch-scroll-btn--left" aria-label="เลื่อนซ้าย">
                            &#8249;
                        </button>
                        <div class="merch-container-body" id="merch-container-skirts"></div>
                        <button class="merch-scroll-btn merch-scroll-btn--right" aria-label="เลื่อนขวา">
                            &#8250;
                        </button>
                    </div>

            </section>

            <section>
                <section>
                    <div class="merch-container">
                        <h1 class="title">CAPS</h1>
                        <a class="arrow-btn" href="./src/product/filter-products.html" aria-label="เพิ่มเติม">

                <section>
                    <div class="merch-scroll-wrapper">

    </section>

    <section>
        <footer>
            <div class="footer-container">
                <span class="footer-text"> © 2026 KAI KHONG CHAN </span>
            </div>
        </footer>
    </section>

    <script src="./mockup/products.js"></script>
    <script>
        const containers = [
            { id: "merch-container-shirt", type: "shirt" },
            { id: "merch-container-pants", type: "pants" },
            { id: "merch-container-skirts", type: "skirt" },
            { id: "merch-container-cap", type: "cap" },
        ];

        containers.forEach((c) => {
            const el = document.getElementById(c.id);
            const products = mockProducts
                .filter((p) => p.type === c.type)
                .slice(0, 10);
            el.innerHTML = products
                .map(
                    (p) => `
                    <div class="merch-container-card">
                        <img src="${p.image}" alt="${p.type}" class="merch-img">
                        ${p.status === "ขายแล้ว" ? '<img src="./assets/sell.png" alt="sold" class="sold-overlay">' : ""}
                        <div class="merch-overlay-search">
                            <a href="./src/detail/detail-products.html?id=${p.id}" class="circle">
                                <img src="./public/search.svg" alt="search" class="merch-img-search">
                            </a>
                        </div>
                        <div class="merch-overlay">
                            <span class="merch-overlay-title">${p.name}</span>
                            <span class="merch-overlay-sub">ขนาด: ${p.size}</span>
                            <div class="merch-overlay-sub-detail">
                                <span class="merch-overlay-sub">สี: ${p.color}</span>
                                <span class="merch-overlay-sub">${p.price} บาท</span>
                            </div>
                            <a href="./src/detail/detail-products.html?id=${p.id}" class="merch-overlay-sub">ดูรายละเอียด</a>
                        </div>
                    </div>
                `,
                )
                .join("");
        });

        document.querySelectorAll(".merch-scroll-wrapper").forEach((w) => {
            const track = w.querySelector(".merch-container-body");
            const btnL = w.querySelector(".merch-scroll-btn--left");
            const btnR = w.querySelector(".merch-scroll-btn--right");

            const update = () => {
                const max = track.scrollWidth - track.clientWidth;
                btnL.style.display =
                    track.scrollLeft <= 1 ? "none" : "flex";
                btnR.style.display =
                    track.scrollLeft >= max - 1 ? "none" : "flex";
            };

            btnL.onclick = () => {
                const card = track.querySelector(".merch-container-card");
                const gap = parseFloat(getComputedStyle(track).gap) || 0;
                track.scrollBy({
                    left: -(card.offsetWidth + gap),
                    behavior: "smooth",
                });
            };

            btnR.onclick = () => {
                const card = track.querySelector(".merch-container-card");
                const gap = parseFloat(getComputedStyle(track).gap) || 0;
                track.scrollBy({
                    left: card.offsetWidth + gap,
                    behavior: "smooth",
                });
            };

            track.onscroll = update;
            window.onresize = update;
            update();
        });
    </script>
</body>

</html>
