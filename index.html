<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KKC - Home</title>
    <link rel="stylesheet" href="style/style.css" />
    <!-- Favicon (web icon) -->
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/logo-nrm.jpg" />
    <!-- Alternative formats -->
    <link rel="icon" type="image/x-icon" href="./assets/logo-nrm.jpg" />
    <link rel="apple-touch-icon" sizes="180x180" href="./assets/logo-nrm.jpg" />
</head>

<body>
    <nav>
        <a href="index.html" class="nav-container">
            <img src="./assets/logo.png" alt="logo" class="logo" />
            <!-- <h1 class="title"> KAI KHONG CHAN </h1> -->
        </a>

    <section>

                <!-- hede -->

                            <span class="arrow-btn-icon">&#8250;</span>
                        </a>
                    </div>
                </section>

                <!-- รายการเสื้อ -->
                <section>
                    <div class="merch-scroll-wrapper">
                        <button class="merch-scroll-btn merch-scroll-btn--left" aria-label="เลื่อนซ้าย">
                            &#8249;
                        </button>
                        <div class="merch-container-body" id="merch-container-shirt"></div>
                        <button class="merch-scroll-btn merch-scroll-btn--right" aria-label="เลื่อนขวา">
                            &#8250;
                        </button>
                    </div>
                </section>
            </section>

            <!-- กางเกง -->
            <section>
                <!--  -->
                <section>
                    <div class="merch-container">
                        <h1 class="title">PANTS</h1>
                        <a class="arrow-btn" href="./src/product/products.html" aria-label="เพิ่มเติม">
                            <span class="arrow-btn-text">เพิ่มเติม</span>
                            <span class="arrow-btn-icon">&#8250;</span>
                        </a>
                    </div>
                </section>

                <!--  -->
                <section>
                    <div class="merch-scroll-wrapper">
                        <button class="merch-scroll-btn merch-scroll-btn--left" aria-label="เลื่อนซ้าย">
                            &#8249;
                        </button>
                        <div class="merch-container-body" id="merch-container-pants"></div>
                        <button class="merch-scroll-btn merch-scroll-btn--right" aria-label="เลื่อนขวา">
                            &#8250;
                        </button>
                    </div>
                </section>
            </section>

            <!-- กระโปรง -->
            <section>
                <!--  -->
                <section>
                    <div class="merch-container">
                        <h1 class="title">SKIRTS</h1>
                        <a class="arrow-btn" href="./src/product/products.html" aria-label="เพิ่มเติม">
                            <span class="arrow-btn-text">เพิ่มเติม</span>
                            <span class="arrow-btn-icon">&#8250;</span>
                        </a>
                    </div>
                </section>

                <!--  -->
                <section>
                    <div class="merch-scroll-wrapper">
                        <button class="merch-scroll-btn merch-scroll-btn--left" aria-label="เลื่อนซ้าย">
                            &#8249;
                        </button>
                        <div class="merch-container-body" id="merch-container-skirts"></div>
                        <button class="merch-scroll-btn merch-scroll-btn--right" aria-label="เลื่อนขวา">
                            &#8250;
                        </button>
                    </div>
                </section>
            </section>

            <!-- หมวก -->
            <section>
                <!--  -->
                <section>
                    <div class="merch-container">
                        <h1 class="title">CAPS</h1>
                        <a class="arrow-btn" href="./src/product/products.html" aria-label="เพิ่มเติม">
                            <span class="arrow-btn-text">เพิ่มเติม</span>
                            <span class="arrow-btn-icon">&#8250;</span>
                        </a>
                    </div>
                </section>

                <!--  -->
                <section>
                    <div class="merch-scroll-wrapper">
                        <button class="merch-scroll-btn merch-scroll-btn--left" aria-label="เลื่อนซ้าย">
                            &#8249;
                        </button>
                        <div class="merch-container-body" id="merch-container-cap"></div>

                </section>
            </section>
        </main>
    </section>

    <section>
        <footer>
            <div class="footer-container">
                <span class="footer-text"> © 2026 KAI KHONG CHAN </span>
            </div>
        </footer>
    </section>

    <script src="./js/scroll.js"></script>
    <script src="./mockup/products.js"></script>

    <script>
        const containers = [
            { id: "merch-container-shirt", type: "shirt", alt: "shirt" },
            { id: "merch-container-pants", type: "pants", alt: "pants" },
            { id: "merch-container-skirts", type: "skirt", alt: "skirts" },
            { id: "merch-container-cap", type: "cap", alt: "cap" },
        ];

        containers.forEach((containerInfo) => {
            const container = document.getElementById(containerInfo.id);
            const products = mockProducts
                .filter((p) => p.type === containerInfo.type)
                .slice(0, 10);

            products.forEach((product) => {
                container.innerHTML += `
            <div class="merch-container-card">
                <img src="${product.image}" alt="${containerInfo.alt}" class="merch-img" >
                <div class="merch-overlay-search">
                    <a href="./src/detail/detail-products.html?id=${product.id}" class="circle">
                        <img src="./public/search.svg" alt="other" class="merch-img-search">
                    </a>
                </div>

                <div class="merch-overlay">
                    <span class="merch-overlay-title"> ${product.name}</span>
                    <span class="merch-overlay-sub"> ขนาด: ${product.size} </span>
                    <div class="merch-overlay-sub-detail">
                        <span class="merch-overlay-sub"> สี: ${product.color} </span>
                        <span class="merch-overlay-sub"> ${product.price} บาท </span>
                    </div>
                    <a href="./src/detail/detail-products.html?id=${product.id}" class="merch-overlay-sub">ดูรายละเอียด</a>
                </div>
            </div>
            `;
            });
        });
    </script>
</body>

</html>
